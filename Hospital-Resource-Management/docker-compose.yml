services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: PatientCareSystem
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql 
    networks:
      - noor
    restart: unless-stopped

  php:
    build: .
    container_name: php
    ports:
      - 8080:80
    volumes:
      - .:/var/www/html
    networks:
      - noor
    restart: unless-stopped    
    depends_on:
      - mysql

networks:
  noor:

volumes:
  mysql_data: